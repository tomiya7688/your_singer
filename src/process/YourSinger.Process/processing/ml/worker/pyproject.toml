[project]
name = "your-singer-ml-worker"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = [
  "demucs==4.0.1",
  "speechbrain==1.1.1",
  "scikit-learn==1.9.1",
  "faster-whisper>=1.1,<2",
  "pyopenjtalk==0.4.1"
]

[project.optional-dependencies]
phoneme-supplement = ["style-bert-vits2==2.7.0"]

[project.scripts]
your-singer-ml-worker = "your_singer_ml.main:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
