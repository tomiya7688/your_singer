name: Windows配布物を作成

# 配布物の構築は約25分かかるため、PRでは自動実行せず手動で実行する(任意)。
# 配布前の動作確認は dev-guidelines/workflow.md の「配布前の動作確認」に従う。
# タグ v* を push したときだけ、SignPath Foundationで署名し、GitHub Releaseの下書きを作る(docs/release-signing.md、#62)。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      include_phoneme_models:
        description: "音素補完用の固定モデル資源も含める"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: package-worker-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  package-windows:
    runs-on: windows-latest
    timeout-minutes: 120
    # 成果物のattestation(OIDCによるkeyless署名)に必要。他は読み取りのみ。
    permissions:
      contents: read
      id-token: write
      attestations: write
      # SignPathが、署名依頼の元になったこのrunのartifactを確認するために必要。
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # 署名できない設定のまま25分の構築をしないよう、リリースの前提を最初に確認する。
      - name: リリースの前提を確認(タグ実行のみ)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          SIGNPATH_PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG }}
        run: |
          foreach ($name in @("SIGNPATH_API_TOKEN", "SIGNPATH_ORGANIZATION_ID", "SIGNPATH_PROJECT_SLUG")) {
            if (-not [Environment]::GetEnvironmentVariable($name)) { throw "$name が未設定です。署名できないため、リリースを作りません。" }
          }
          # mainに入っていないコミットのタグからは、リリースを作らない。
          git merge-base --is-ancestor $env:GITHUB_SHA origin/main
          if ($LASTEXITCODE -ne 0) { throw "タグのコミットがmainに含まれていません。" }
      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: "3.12.10"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: pip と certifi を最低版へ更新して確認
        shell: pwsh
        run: |
          python -m pip install "pip>=26.2.2" "certifi>=2026.10.19"
          python tools/verify_python_trust.py
          if ($LASTEXITCODE -ne 0) { throw "配布ビルド用Pythonのpip/certifiが最低版を満たしていません。" }
      - name: 専用Pythonの依存分離を検証
        shell: pwsh
        run: |
          $env:YOURSINGER_TRAINER_PYTHON_SOURCE = (python -c "import sys; print(sys.base_prefix)").Trim()
          $env:TEMP = Join-Path $env:GITHUB_WORKSPACE "artifacts/temp"
          $env:TMP = $env:TEMP
          New-Item -ItemType Directory -Force -Path $env:TEMP | Out-Null
          python -m unittest discover -s tests/tools -v
          if ($LASTEXITCODE -ne 0) { throw "専用Pythonの複製・初期化・依存分離に失敗しました。" }
      - uses: mamba-org/setup-micromamba@v3
        with:
          environment-name: mfa-runtime
          create-args: >-
            python=3.12
            montreal-forced-aligner=3.4.2
            kaldi=5.5.1172=cpu*
            pip>=26.2.2
            certifi>=2026.10.19
          init-shell: none
          cache-environment: true
      - name: 固定版MFAをオフライン配布用に配置
        shell: pwsh
        run: |
          $mfaRuntime = (micromamba run -n mfa-runtime python -c "import sys; print(sys.prefix)").Trim()
          if ($LASTEXITCODE -ne 0) { throw "MFA runtimeの保存先を取得できませんでした。" }
          python tools/prepare_mfa_bundle.py --runtime $mfaRuntime --output artifacts/mfa-bundle
          if ($LASTEXITCODE -ne 0) { throw "MFA配布資源を構築できませんでした。" }
          & artifacts/mfa-bundle/runtime/python.exe -I tools/verify_python_trust.py
          if ($LASTEXITCODE -ne 0) { throw "MFA配布資源のpip/certifiが最低版を満たしていません。" }
      - name: トークTrainerの専用CUDA環境と固定モデルを配置
        shell: pwsh
        run: |
          $pythonRuntime = (python -c "import sys; print(sys.base_prefix)").Trim()
          if ($LASTEXITCODE -ne 0) { throw "Python runtimeの保存先を取得できませんでした。" }
          ./tools/build_style_bert_vits2_runtime.ps1 -PythonRuntimeDirectory $pythonRuntime
          python tools/prepare_style_bert_vits2_bundle.py --runtime artifacts/style-bert-vits2-runtime
          if ($LASTEXITCODE -ne 0) { throw "トークTrainerの固定資源を構築できませんでした。" }
      - name: DiffSinger専用runtimeと固定ソースを配置
        shell: pwsh
        run: |
          $pythonRuntime = (python -c "import sys; print(sys.base_prefix)").Trim()
          if ($LASTEXITCODE -ne 0) { throw "Python runtimeの保存先を取得できませんでした。" }
          python tools/prepare_diffsinger_source.py
          if ($LASTEXITCODE -ne 0) { throw "DiffSinger固定ソースを取得できませんでした。" }
          ./tools/build_diffsinger_runtime.ps1 -PythonRuntimeDirectory $pythonRuntime
          if ($LASTEXITCODE -ne 0) { throw "DiffSinger専用runtimeを構築できませんでした。" }
      - name: Windows自己完結配布物を構築
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch" -and "${{ inputs.include_phoneme_models }}" -eq "true") {
            ./tools/build_windows_distribution.ps1 -IncludePhonemeModels -PythonExecutable "${{ steps.python.outputs.python-path }}"
          } else {
            ./tools/build_windows_distribution.ps1 -PythonExecutable "${{ steps.python.outputs.python-path }}"
          }
      - name: ワーカー起動確認
        shell: pwsh
        run: |
          $root = Resolve-Path artifacts/windows-distribution
          $worker = Resolve-Path (Join-Path $root "workers/YourSinger.ML.exe")
          $trainer = Join-Path $root "workers/style-bert-vits2"
          $diffSinger = Join-Path $root "workers/diffsinger"
          $diffSingerManifest = Get-Content (Join-Path $diffSinger "bundle-manifest.json") -Raw | ConvertFrom-Json
          if ($diffSingerManifest.source_commit -ne "323a5693245b827caba0ab1a7371fe5ca885b061" -or $diffSingerManifest.training_run) {
            throw "配布されたDiffSinger固定ソースまたは実行状態が不正です。"
          }
          $probeDirectory = Join-Path $env:GITHUB_WORKSPACE "artifacts/trainer-probe"
          New-Item -ItemType Directory -Force $probeDirectory | Out-Null
          $env:TEMP = $probeDirectory
          $env:TMP = $probeDirectory
          $env:PYTHONPYCACHEPREFIX = Join-Path $probeDirectory "bytecode"
          $env:HF_HOME = Join-Path $probeDirectory "huggingface"
          $env:HF_HUB_OFFLINE = "1"
          $env:TRANSFORMERS_OFFLINE = "1"
          Remove-Item Env:PYTHONPATH -ErrorAction SilentlyContinue
          $diffSingerRuntime = Join-Path $diffSinger "runtime"
          $diffSingerProbeOutput = Join-Path $probeDirectory "diffsinger-runtime-probe.json"
          & (Join-Path $diffSingerRuntime "python.exe") tools/probe_diffsinger_runtime.py --root $diffSingerRuntime --source (Join-Path $diffSinger "source") --output $diffSingerProbeOutput --lock (Join-Path $diffSinger "diffsinger-source.lock.json")
          if ($LASTEXITCODE -ne 0) { throw "配布先からDiffSinger Trainer専用runtimeを読み込めません。" }
          $diffSingerProbe = Get-Content $diffSingerProbeOutput -Raw | ConvertFrom-Json
          if (-not $diffSingerProbe.official_training_entry_imported -or $diffSingerProbe.training_run -or $diffSingerProbe.binarization_run) {
            throw "DiffSinger runtimeの入口確認結果が不正です。"
          }
          & (Join-Path $trainer "runtime/python.exe") (Join-Path $trainer "runtime-probe.py") --root $trainer --output (Join-Path $probeDirectory "runtime-probe.json")
          if ($LASTEXITCODE -ne 0) { throw "配布先からトークTrainerの専用依存・モデルを読み込めません。" }
          $models = Join-Path $root "workers/models/phoneme-supplement"
          if (-not (Test-Path (Join-Path $root "YourSinger.exe"))) { throw "YourSinger.exe が配布物にありません" }
          if (-not (Test-Path (Join-Path $root "coreclr.dll"))) { throw ".NET自己完結runtimeが配布物にありません" }
          $alignmentRequest = @{ request_id = "alignment-smoke"; command = "forced_alignment_preflight"; payload = @{} } | ConvertTo-Json -Compress
          $alignmentResponse = ($alignmentRequest | & $worker) | ConvertFrom-Json
          if ($alignmentResponse.status -ne "ok" -or -not $alignmentResponse.result.ready -or $alignmentResponse.result.mfa_version -ne "3.4.2") {
            throw "MFA同梱資源の版・整合性確認に失敗しました。"
          }
          $withModels = ("${{ github.event_name }}" -eq "workflow_dispatch" -and "${{ inputs.include_phoneme_models }}" -eq "true")
          $payload = @{ request_id = "smoke"; command = "phoneme_supplement_preflight"; payload = @{ resources_root = $models; full_verify = $withModels } } | ConvertTo-Json -Compress
          $response = $payload | & $worker
          if (-not $response) { throw "ワーカーから応答がありません" }
          $json = $response | ConvertFrom-Json
          if ($json.request_id -ne "smoke" -or $json.status -ne "ok") { throw "preflight応答が不正です: $response" }
          $expectedVersions = @{
            "style-bert-vits2" = "2.7.0"
            "speechbrain" = "1.1.1"
            "faster-whisper" = "1.1.1"
            "pyopenjtalk-dict" = "0.3.4.dev2"
            "numpy" = "1.26.4"
            "accelerate" = "0.34.2"
            "setuptools" = "80.9.0"
          }
          foreach ($name in $expectedVersions.Keys) {
            $actual = $json.result.versions.PSObject.Properties[$name].Value
            if ($actual -ne $expectedVersions[$name]) {
              throw "包装したruntimeの版が不正です: $name expected=$($expectedVersions[$name]) actual=$actual"
            }
          }
          $runtimeIssues = @($json.result.issues | Where-Object { $_ -match "ワーカーに同梱されていません|発音辞書" })
          if ($runtimeIssues.Count -gt 0) { throw "包装runtimeが不足しています: $($runtimeIssues -join ' / ')" }
          if ($withModels -and -not $json.result.ready) { throw "同梱モデルのpreflightに失敗しました: $response" }
          if (-not $withModels) {
            if ($json.result.ready) { throw "モデルなし包装なのにpreflightが準備完了を返しました" }
            $modelMissing = @($json.result.issues | Where-Object { $_ -match "manifestまたはlock" })
            if ($modelMissing.Count -eq 0) { throw "モデルなし包装の不足理由が想定と異なります: $response" }
          }
      # 以下の署名は、配布物全体(数GB)ではなく自社製のexe/dllだけをSignPathへ渡す。
      - name: 署名対象の自社製バイナリを取り出し(タグ実行のみ)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: ./tools/stage_signing_files.ps1 -Mode Collect -StagingDirectory artifacts/signing-input
      - name: 署名対象をアップロード(タグ実行のみ)
        id: upload-unsigned
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: signing-input
          path: artifacts/signing-input
          retention-days: 1
      - name: SignPath Foundationで署名(タグ実行のみ)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: release-signing
          artifact-configuration-slug: initial
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: artifacts/signing-output
      - name: 署名済みバイナリを書き戻してmanifestを更新(タグ実行のみ)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          ./tools/stage_signing_files.ps1 -Mode Restore -StagingDirectory artifacts/signing-output
          ./tools/update_distribution_manifest.ps1
      - name: 最終成果物(ZIPとSHA256SUMS)を作成
        shell: pwsh
        run: |
          # スクリプトは失敗時に例外を投げる。ps1呼び出しは$LASTEXITCODEを更新しないため、終了コードは確認しない。
          ./tools/package_distribution_archive.ps1
          ./tools/verify_distribution_signing.ps1 -ReleaseDirectory artifacts/release
      # 署名と検証のどちらかが失敗したら、ここで止まりリリースは作られない。
      - name: 公開リリースの署名ゲート(タグ実行のみ)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: ./tools/verify_distribution_signing.ps1 -ReleaseDirectory artifacts/release -DistributionDirectory artifacts/windows-distribution -RequireAuthenticode -ExpectedSignerSubject "SignPath Foundation" -RequireRfc3161
      # 未保護のブランチで変更したworkflowからattestationを発行しないよう、mainとリリースタグに限定する。
      # それ以外のrefの手動実行は、構築と配布物の確認だけを行う。
      - name: 最終成果物のArtifact Attestationを作成
        id: attest
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: |
            artifacts/release/YourSinger-windows-x64.zip
            artifacts/release/SHA256SUMS
      - name: Attestationを検証
        if: steps.attest.outcome == 'success'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          foreach ($subject in @("YourSinger-windows-x64.zip", "SHA256SUMS")) {
            gh attestation verify (Join-Path "artifacts/release" $subject) --repo "${{ github.repository }}" --signer-workflow "${{ github.repository }}/.github/workflows/package-worker.yml" --source-ref "${{ github.ref }}"
            if ($LASTEXITCODE -ne 0) { throw "$subject のattestation検証に失敗しました。" }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: YourSinger-windows-x64
          path: artifacts/release/*
          retention-days: 14

  # 署名・検証・attestationが全て成功した場合だけ、GitHub Releaseの下書きを作る。書き込み権限はこのジョブだけが持つ。
  release-draft:
    needs: package-windows
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: YourSinger-windows-x64
          path: release
      - name: ZIPの大きさを確認して下書きを作成
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # GitHub Releaseの1ファイルの上限は2GiB。超える場合は公開できないため失敗させる。
          size=$(stat -c %s release/YourSinger-windows-x64.zip)
          if [ "$size" -ge 2147483648 ]; then
            echo "ZIPが2GiBを超えています($size bytes)。Releaseへ添付できません。" >&2
            exit 1
          fi
          (cd release && sha256sum -c SHA256SUMS)
          gh attestation verify release/YourSinger-windows-x64.zip --repo "${{ github.repository }}" --signer-workflow "${{ github.repository }}/.github/workflows/package-worker.yml" --source-ref "${{ github.ref }}"
          gh release create "${{ github.ref_name }}" release/* --repo "${{ github.repository }}" --verify-tag --draft --title "${{ github.ref_name }}" --notes "署名と検証が完了した配布物です。公開前に、README の「配布物の検証」の手順で確認してください。"
