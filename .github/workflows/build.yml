name: ビルド・回帰テスト

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  dotnet:
    name: .NET検証 (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: '3.11'
      - name: アプリをビルド
        run: dotnet build src/ui/YourSinger.App/YourSinger.App.csproj --configuration Release
      - name: 回帰・データ境界・プロセス境界テスト
        env:
          YOURSINGER_TEST_PYTHON: ${{ steps.python.outputs.python-path }}
        run: dotnet test tests/YourSinger.Process.Tests/YourSinger.Process.Tests.csproj --configuration Release --filter "Category!=FfmpegIntegration" --logger "trx;LogFileName=regression.trx" --results-directory TestResults
      - name: 実入力テスト用FFmpegを準備
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: 実FFmpegによる単一入力・フォルダ入力・差分再読込
        if: runner.os == 'Linux'
        env:
          YOURSINGER_TEST_FFMPEG: ffmpeg
        run: dotnet test tests/YourSinger.Process.Tests/YourSinger.Process.Tests.csproj --configuration Release --no-build --filter "Category=FfmpegIntegration" --logger "trx;LogFileName=ffmpeg.trx" --results-directory TestResults
      - name: テスト結果を保存
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-${{ matrix.os }}
          path: TestResults/**
          if-no-files-found: warn
          retention-days: 14

  worker:
    name: Pythonワーカー検証
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 構文確認
        run: python -m compileall -q src/process/YourSinger.Process/processing/ml/worker/your_singer_ml
      - name: モデル不要のJSON通信回帰テスト
        run: python -m unittest discover -s tests/worker -v
