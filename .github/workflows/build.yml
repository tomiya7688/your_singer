name: ビルド・回帰テスト

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  dotnet:
    name: .NET検証 (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: 音声入力テスト用FFmpegを導入
        if: runner.os == 'Windows'
        run: choco install ffmpeg --no-progress -y
      - name: 音声入力テスト用FFmpegを導入
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: '3.11'
      - name: pip と certifi を最低版へ更新して確認
        run: |
          python -m pip install "pip>=26.2.2" "certifi>=2026.10.19"
          python tools/verify_python_trust.py
      - name: アプリをビルド
        run: dotnet build src/ui/YourSinger.App/YourSinger.App.csproj --configuration Release
      - name: 回帰・データ境界・ワーカー通信テスト
        env:
          YOURSINGER_TEST_PYTHON: ${{ steps.python.outputs.python-path }}
        run: dotnet test tests/YourSinger.Process.Tests/YourSinger.Process.Tests.csproj --configuration Release --logger "trx;LogFileName=regression.trx" --results-directory TestResults -- RunConfiguration.MaxCpuCount=1
      - name: テスト結果を保存
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-${{ matrix.os }}
          path: TestResults/**
          if-no-files-found: warn
          retention-days: 14

  worker:
    name: Python補完候補・通信検証
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 構文確認
        run: python -m compileall -q src/process/YourSinger.Process/processing/ml/worker/your_singer_ml
      - name: pip と certifi を最低版へ更新して確認
        run: |
          python -m pip install "pip>=26.2.2" "certifi>=2026.10.19"
          python tools/verify_python_trust.py
      - name: 数値処理の固定依存を導入
        run: python -m pip install numpy==1.26.4
      - name: モデル不要の候補検証テスト
        env:
          PYTHONPATH: src/process/YourSinger.Process/processing/ml/worker
        run: python -m unittest discover -s tests/worker -v
